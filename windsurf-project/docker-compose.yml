version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: omnichannel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: omnichannel_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: omnichannel-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=your-evolution-api-global-key
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - LOG_LEVEL=WARN
    depends_on:
      - postgres

volumes:
  postgres_data:
