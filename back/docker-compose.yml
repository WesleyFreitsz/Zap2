version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: omnichannel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnichannel_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
